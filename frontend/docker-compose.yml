services:
  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-4040}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - frontend-network
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-development}
    volumes:
      - .:/app
      - /app/node_modules
      - storage_data:/app/storage
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-http://host.docker.internal:3000}
    networks:
      - frontend-network
    restart: unless-stopped

volumes:
  storage_data:

networks:
  frontend-network:
    driver: bridge
