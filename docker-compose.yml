services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-jobvault}
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jobvault-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-express:
    build:
      context: ./backend-express
      dockerfile: Dockerfile
      target: development
    # Apply pending Drizzle migrations on startup, then run the dev server.
    # Postgres readiness is guaranteed by the depends_on healthcheck below.
    command: sh -c "npm run db:migrate && npm run dev"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend-express:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-jobvault}
      JWT_SECRET: ${JWT_SECRET:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      ENABLE_REALTIME: ${ENABLE_REALTIME:-true}
      # AI (Gemini) — powers résumés, cover letters, and scraper AI normalization.
      # Set GEMINI_API_KEY in the root .env to enable; empty leaves AI features off.
      # No `:-` default on purpose: an unset key makes compose warn out loud.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-2.5-flash-lite}
      # URL scraper render fallback (JS-rendered / bot-protected boards). Jina
      # Reader works with no key; JINA_API_KEY raises rate limits.
      SCRAPER_RENDER_ENABLED: ${SCRAPER_RENDER_ENABLED:-true}
      JINA_API_KEY: ${JINA_API_KEY}
      SEED_EMAIL: ${SEED_EMAIL:-demo@jobvault.app}
      SEED_PASSWORD: ${SEED_PASSWORD:-demo1234}
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobvault-network
    restart: unless-stopped

  frontend-next:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      target: development
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    volumes:
      - ./frontend-next:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      # Server-side proxy target (Next rewrites + Server Components). The browser
      # never uses this — it calls /api/* same-origin and Next proxies it here.
      BACKEND_INTERNAL_URL: http://backend-express:3000
      NEXT_PUBLIC_API_BASE: http://backend-express:3000
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend-express
    networks:
      - jobvault-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  jobvault-network:
    driver: bridge
